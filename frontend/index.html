<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mellow. — 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: #13131a;
      --border: #1e1e2e;
      --accent: #c8a97e;
      --accent-hover: #d4b98e;
      --text: #f0ede8;
      --muted: #888;
      --dim: #444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── 배경 오브 ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .orb1 {
      width: 500px;
      height: 500px;
      background: rgba(200, 169, 126, .07);
      top: -150px;
      left: -100px;
    }

    .orb2 {
      width: 350px;
      height: 350px;
      background: rgba(200, 169, 126, .04);
      bottom: -80px;
      right: 250px;
    }

    /* ── 왼쪽 패널 ── */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 70px;
      position: relative;
      z-index: 1;
      animation: fadeUp .7s ease both;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      letter-spacing: -.02em;
      margin-bottom: 64px;
    }

    .brand span {
      color: var(--accent);
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 3.4rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.03em;
      margin-bottom: 24px;
    }

    .tagline em {
      font-style: italic;
      color: var(--accent);
    }

    .sub-tagline {
      font-size: .95rem;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.7;
      max-width: 340px;
    }

    /* 장식선 */
    .deco-line {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 40px 0;
      opacity: .5;
    }

    /* ── 오른쪽 패널 ── */
    .right-panel {
      width: 480px;
      min-height: 100vh;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 50px;
      position: relative;
      z-index: 1;
    }

    .form-box {
      width: 100%;
      max-width: 360px;
    }

    /* ── 탭 ── */
    .tabs {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 40px;
    }

    .tab-btn {
      flex: 1;
      padding: 11px;
      background: none;
      border: none;
      color: var(--dim);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 9px;
      transition: all .25s ease;
      letter-spacing: .02em;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--bg);
    }

    /* ── 폼 헤더 ── */
    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 6px;
    }

    .form-subtitle {
      font-size: .85rem;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 32px;
    }

    /* ── 입력 ── */
    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: .7rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 300;
      outline: none;
      transition: border-color .2s;
    }

    .input-field::placeholder {
      color: #2a2a3a;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    /* ── 버튼 ── */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      font-weight: 500;
      letter-spacing: .03em;
      cursor: pointer;
      margin-top: 6px;
      transition: background .2s, transform .15s;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* ── 구분선 ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: #333;
      font-size: .75rem;
      letter-spacing: .05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── 소셜 버튼 ── */
    .social-btn {
      width: 100%;
      padding: 12px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: .85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: border-color .2s, color .2s, background .2s;
    }

    .social-btn:hover {
      border-color: #333;
      color: var(--text);
      background: #0f0f17;
    }

    /* ── 하단 링크 ── */
    .link-text {
      margin-top: 26px;
      text-align: center;
      font-size: .83rem;
      color: var(--dim);
    }

    .link-text button {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .83rem;
      font-weight: 500;
    }

    .link-text button:hover {
      text-decoration: underline;
    }

    /* ── 토스트 ── */
    #toast {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 28px;
      border-radius: 100px;
      font-size: .85rem;
      z-index: 999;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── 슬라이드 애니메이션 ── */
    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: fadeUp .35s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── 반응형 ── */
    @media (max-width: 768px) {
      .left-panel {
        display: none;
      }

      .right-panel {
        width: 100%;
        border: none;
        padding: 40px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <!-- 왼쪽 -->
  <div class="left-panel">
    <div class="brand">Bellow<span>.</span></div>
    <h1 class="tagline">
      당신의 하루를<br><em>더 스마트하게</em><br>관리하세요
    </h1>
    <div class="deco-line"></div>
    <p class="sub-tagline">AI 비서와 함께라면 일정 관리가<br>훨씬 쉬워집니다. 지금 시작해보세요.</p>
  </div>

  <!-- 오른쪽 -->
  <div class="right-panel">
    <div class="form-box">

      <!-- 탭 -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">로그인</button>
        <button class="tab-btn" onclick="switchTab('signup')">회원가입</button>
      </div>

      <!-- 로그인 폼 -->
      <div id="loginSection" class="form-section active">
        <h2 class="form-title">다시 오셨군요</h2>
        <p class="form-subtitle">계정에 로그인하여 일정을 확인하세요</p>

        <div class="input-group">
          <label class="input-label">유저네임</label>
          <input type="text" id="loginUsername" class="input-field" placeholder="홍길동">
        </div>
        <div class="input-group">
          <label class="input-label">비밀번호</label>
          <input type="password" id="loginPw" class="input-field" placeholder="••••••••">
        </div>

        <button class="submit-btn" onclick="handleLogin()">로그인</button>

        <div class="divider">또는</div>
        <button class="social-btn" onclick="showToast('Google 로그인은 준비 중이에요 😊')">
          <svg width="17" height="17" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Google로 계속하기
        </button>

        <p class="link-text">계정이 없으신가요? <button onclick="switchTab('signup')">회원가입</button></p>
      </div>

      <!-- 회원가입 폼 -->
      <div id="signupSection" class="form-section">
        <h2 class="form-title">시작해볼까요</h2>
        <p class="form-subtitle">몇 가지 정보만 입력하면 바로 시작됩니다</p>

        <div class="input-group">
          <label class="input-label">이름</label>
          <input type="text" id="signupName" class="input-field" placeholder="홍길동">
        </div>
        <div class="input-group">
          <label class="input-label">이메일</label>
          <input type="email" id="signupEmail" class="input-field" placeholder="hello@example.com">
        </div>
        <div class="input-group">
          <label class="input-label">비밀번호</label>
          <input type="password" id="signupPw" class="input-field" placeholder="••••••••">
        </div>
        <div class="input-group">
          <label class="input-label">비밀번호 확인</label>
          <input type="password" id="signupPwConfirm" class="input-field" placeholder="••••••••">
        </div>

        <button class="submit-btn" onclick="handleSignup()">계정 만들기</button>

        <p class="link-text">이미 계정이 있으신가요? <button onclick="switchTab('login')">로그인</button></p>
      </div>

    </div>
  </div>

  <!-- 토스트 -->
  <div id="toast"></div>

  <script>
    //const API_URL = 'http://127.0.0.1:8000';
    const API_URL = "https://ai-secretary-uvdd.onrender.com"

    // ── 토스트 ──
    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ── 탭 전환 ──
    function switchTab(mode) {
      const tabs = document.querySelectorAll('.tab-btn');
      const loginSec = document.getElementById('loginSection');
      const signupSec = document.getElementById('signupSection');

      if (mode === 'login') {
        tabs[0].classList.add('active'); tabs[1].classList.remove('active');
        loginSec.classList.add('active'); signupSec.classList.remove('active');
      } else {
        tabs[1].classList.add('active'); tabs[0].classList.remove('active');
        signupSec.classList.add('active'); loginSec.classList.remove('active');
      }
    }

    // ── 로그인 (OAuth2PasswordRequestForm → form-data 형식으로 전송) ──
    async function handleLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const pw = document.getElementById('loginPw').value;

      if (!username || !pw) return showToast('⚠️ 유저네임과 비밀번호를 입력해주세요.');

      // OAuth2PasswordRequestForm은 JSON이 아닌 form-data 형식이어야 함
      const formData = new FormData();
      formData.append('username', username);
      formData.append('password', pw);

      showToast('🔄 로그인 중...');
      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (!res.ok) return showToast('❌ ' + (data.detail || '로그인에 실패했습니다.'));

        // JWT 토큰을 localStorage에 저장
        localStorage.setItem('access_token', data.access_token);

        showToast('👋 환영합니다!');
        setTimeout(() => window.location.href = 'todo.html', 800);

      } catch (e) {
        showToast('❌ 서버에 연결할 수 없습니다.');
      }
    }

    // ── 회원가입 ──
    async function handleSignup() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pw = document.getElementById('signupPw').value;
      const confirm = document.getElementById('signupPwConfirm').value;

      if (!name || !email || !pw || !confirm) return showToast('⚠️ 모든 항목을 입력해주세요.');
      if (pw !== confirm) return showToast('⚠️ 비밀번호가 일치하지 않습니다.');
      if (pw.length < 6) return showToast('⚠️ 비밀번호는 6자 이상이어야 합니다.');

      showToast('🔄 가입 중...');
      try {
        const res = await fetch(`${API_URL}/auth/resister`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, username: name, password: pw })
        });
        const data = await res.json();

        if (!res.ok) return showToast('❌ ' + (data.detail || '회원가입에 실패했습니다.'));

        showToast('✅ 회원가입 완료! 로그인해주세요.');
        setTimeout(() => switchTab('login'), 1200);

      } catch (e) {
        showToast('❌ 서버에 연결할 수 없습니다.');
      }
    }

    // ── 엔터키 지원 ──
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const loginActive = document.getElementById('loginSection').classList.contains('active');
      loginActive ? handleLogin() : handleSignup();
    });
  </script>
</body>

</html>
